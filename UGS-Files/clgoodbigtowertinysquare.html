<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Big Tower Tiny Square</title>
<style>
html,body,#c2canvasdiv{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#c2canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<base href="https://cdn.jsdelivr.net/gh/bobydob/godotpack@4c6d9fa05fc283afaf4339211ea7d441488efad7/side/big-tts/">
</head>
<body>
<div id="c2canvasdiv"><canvas id="c2canvas" width="1920" height="1080">Your browser does not support HTML5 canvas.</canvas></div>
<script src="https://cdn.jsdelivr.net/gh/OutRed/outredgames@2fe3381b1dde77159e2205f0127ea8a6647e77a2/g/assets/btts/jquery-2.1.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/bobydob/godotpack@4c6d9fa05fc283afaf4339211ea7d441488efad7/side/big-tts/btts.js"></script>
<script>
(function(){
  function start(){
    if(typeof window.cr_createRuntime!=='function'||!window.jQuery){
      document.title='Big Tower Tiny Square — loading failed';
      return;
    }
    window.jQuery(function(){window.cr_createRuntime('c2canvas');});
  }
  window.addEventListener('load',start,{once:true});
  document.addEventListener('visibilitychange',function(){
    if(typeof window.cr_setSuspended==='function')window.cr_setSuspended(!!document.hidden);
  });
})();
</script>
</body>
</html>
