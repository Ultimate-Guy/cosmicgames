<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code.org</title>
<style>html,body{margin:0;min-height:100%;background:#fff;color:#182b49;font:16px system-ui}#status{padding:18px}</style>
</head>
<body>
<div id="status" role="status">Loading Code.org…</div>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    const response=await fetch('https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/AASINGLEFILE.html');
    if(!response.ok)throw new Error('HTTP '+response.status);
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    status.textContent='Code.org could not load. Please try again.';
    console.error('Code.org loader failed:',error);
  }
})();
</script>
</body>
</html>
